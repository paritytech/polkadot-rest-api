name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: most jobs only read the repo. The build job that produces
# image provenance elevates id-token:write on its own (see build_docker).
permissions:
  contents: read

jobs:
  set-variables:
    # This workaround sets the container image for each job using 'set-variables' job output.
    # env variables don't work for PR from forks, so we need to use outputs.
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      DATE_TAG: ${{ steps.version.outputs.DATE_TAG }}
      IS_LATEST: ${{ steps.version.outputs.IS_LATEST }}
    steps:
      - name: Define version
        id: version
        # Pass workflow context through env vars (not inline ${{ }} in the
        # script) so attacker-controllable values can't be expanded as code.
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          COMMIT_SHA_SHORT=${COMMIT_SHA:0:8}
          echo "DATE_TAG=$(date -u +'%Y%m%d-%H%M%S')-${COMMIT_SHA_SHORT}" >> "${GITHUB_OUTPUT}"
          REF_SLUG=${REF_NAME//\//_}
          if [[ ${REF_SLUG} == "main" ]]
          then
            echo "VERSION=${REF_SLUG}-${COMMIT_SHA_SHORT}" >> "${GITHUB_OUTPUT}"
          else
            echo "VERSION=${REF_SLUG}" >> "${GITHUB_OUTPUT}"
          fi
          # Tag `latest` only for version tag builds (refs/tags/v*), never for
          # main/branch builds, so `latest` always points at a released version.
          if [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" == v* ]]
          then
            echo "IS_LATEST=true" >> "${GITHUB_OUTPUT}"
          else
            echo "IS_LATEST=false" >> "${GITHUB_OUTPUT}"
          fi

  build_docker:
    name: Build docker image (${{ matrix.platform }})
    needs: [set-variables]
    environment: ${{ github.event_name == 'push' && 'main_n_tags' || null }}
    permissions:
      contents: read # checkout
      id-token: write # OIDC token for docker/build-push-action image provenance
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.set-variables.outputs.VERSION }}
      DATE_TAG: ${{ needs.set-variables.outputs.DATE_TAG }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/paritytech/polkadot-rest-api,push-by-digest=true,name-canonical=true
          push: ${{ github.event_name == 'push' }}
      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_manifests:
    name: Merge multi-arch manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [set-variables, build_docker]
    environment: main_n_tags
    env:
      VERSION: ${{ needs.set-variables.outputs.VERSION }}
      DATE_TAG: ${{ needs.set-variables.outputs.DATE_TAG }}
      IS_LATEST: ${{ needs.set-variables.outputs.IS_LATEST }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE=docker.io/paritytech/polkadot-rest-api
          TAGS=(-t "${IMAGE}:${VERSION}" -t "${IMAGE}:${DATE_TAG}")
          # Only tag `latest` on version tag builds (see set-variables job).
          if [[ "${IS_LATEST}" == "true" ]]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${TAGS[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)
